# Dependency updates. "daily" runs Monday to Friday.
# Commit prefixes decide whether semantic-release publishes a new version when the PR is merged:
#   build(deps): ...  -> patch release (code that runs on daedalus)
#   ci(deps): ...     -> no release (pipeline and release tooling)
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: build
      include: scope
    groups:
      # client_golang and its Prometheus dependencies are usually updated together
      prometheus:
        patterns:
          - github.com/prometheus/*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # the amd64 image of v2.6.0 is missing on ghcr.io (2026-11-24), remove once a fixed release exists
      - dependency-name: ossf/scorecard-action
        versions: ["2.6.0"]

  # hook versions in .pre-commit-config.yaml; the CI lint job uses the same golangci-lint/actionlint versions
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: ci
      include: scope
    groups:
      pre-commit:
        patterns:
          - "*"
